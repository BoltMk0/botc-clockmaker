<!doctype html>
<html lang="en" style="height: 100%; width: 100%; background-color: #151515; overscroll-behavior: none;">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		
		<meta name="apple-mobile-web-app-theme-color" content="#0f172a" />
		<meta name="theme-color" content="#0f172a" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: #151515; overscroll-behavior: none;">
		<div style="display: contents">%sveltekit.body%</div>

</html>
