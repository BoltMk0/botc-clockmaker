<!doctype html>
<html lang="en" style="height: 100%; width: 100%; color-scheme: dark; background-color: #282828; overscroll-behavior: none;">
	<head>
		<meta charset="utf-8" />
		<!-- The app is dark throughout: saying so keeps phone browsers' forced dark modes (Chrome, Samsung Internet) from re-darkening it, which flattens the translucent panels into the background -->
		<meta name="color-scheme" content="dark" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<link rel="apple-touch-icon" href="/icons/appicon_256x256.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		
		<meta name="apple-mobile-web-app-theme-color" content="#0f172a" />
		<meta name="theme-color" content="#0f172a" />
		<title>Clockmaker</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" style="background-color: #282828; overscroll-behavior: none;">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
