services:
  server:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    environment:
      - RESOURCE_DATA_DIR=/data
    # Secrets (SECRETS_KEY, TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, GMAIL_*, FEEDBACK_TO_EMAILS, SPOTIFY_*) are read at runtime from .env, if present.
    # With SECRETS_KEY set, the others can be set in the app instead (Settings → Feedback and Music Library).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
volumes:
  data:
