services:
  server:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    environment:
      - RESOURCE_DATA_DIR=/data
    # Secrets (TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, GMAIL_*, FEEDBACK_TO_EMAILS, SPOTIFY_*) are read at runtime from .env, if present
    env_file:
      - path: .env
        required: false
volumes:
  data:
