# Lightscapes, with Zigbee2MQTT and the MQTT broker they talk through, for the computer by the game (e.g. a Raspberry Pi).
# Set up as in README.md, then from this folder: docker compose up -d --build
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Loaded from /etc/mosquitto, where it's allowed by the AppArmor profile Ubuntu has for Mosquitto, which also
    # applies to this one's under rootless Docker
    command: mosquitto -c /etc/mosquitto/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    # No ports: only Zigbee2MQTT and Lightscapes use it, over Compose's own network

  # For developing Lightscapes without the adapter: a broker on localhost:1883 for `npm run dev`.
  # Only started when named: docker compose up mosquitto-dev
  mosquitto-dev:
    image: eclipse-mosquitto:2
    profiles: [dev]
    command: mosquitto -c /etc/mosquitto/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    ports:
      - 127.0.0.1:1883:1883

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      # The Zigbee adapter: set ZIGBEE_ADAPTER in .env to its /dev/serial/by-id/... path. It keeps that path in the
      # container, as rootless Docker can only pass a device through under its own path. Unset, the path is one that
      # says so when Zigbee2MQTT starts (a required variable would stop every service starting, mosquitto-dev too)
      - ${ZIGBEE_ADAPTER:-/dev/set-ZIGBEE_ADAPTER-in-.env}:${ZIGBEE_ADAPTER:-/dev/set-ZIGBEE_ADAPTER-in-.env}
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=${TZ:-UTC}
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=${ZIGBEE_ADAPTER:-/dev/set-ZIGBEE_ADAPTER-in-.env}
    ports:
      # Zigbee2MQTT's own page, for pairing devices
      - ${BIND_ADDRESS:-0.0.0.0}:8080:8080

  lightscapes:
    build:
      # The repository root: Lightscapes shares some of Clockmaker's source
      context: ..
      dockerfile: lightscapes/Dockerfile
    image: lightscapes
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./data/lightscapes:/data
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - LIGHTSCAPES_PASSWORD=${LIGHTSCAPES_PASSWORD:-}
      - TZ=${TZ:-UTC}
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:8090:8090
    # If Clockmaker's address is a Tailscale MagicDNS name the container can't resolve, use Tailscale's resolver:
    # dns:
    #   - 100.100.100.100
